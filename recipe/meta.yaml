{% set name = "lumen" %}
{% set version = "1.4.0" %}

# This recipe builds multiple outputs:
# - lumen: The main package with core functionality
# - lumen-ai: Package with all AI dependencies (except provider-specific ones)
# - lumen-ai-local: Metapackage that adds huggingface_hub for local AI models
# - lumen-ai-openai: Metapackage that adds OpenAI support
# - lumen-ai-mistralai: Metapackage that adds MistralAI support
# - lumen-ai-anthropic: Metapackage that adds Anthropic support
package:
  name: {{ name }}-bundle
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1e6f090d679275a10462df9bb299616732e7105bc6e0d289b63b7e774cba62da

build:
  number: 0

outputs:
  # Main lumen package
  - name: {{ name }}
    build:
      entry_points:
        - lumen = lumen.command:main
      skip: true  # [py<311]
      script: python -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
    requirements:
      host:
        - python
        - pip
        - hatchling
        - hatch-vcs
      run:
        - python
        - bokeh >=3.9.0
        - chardet
        - duckdb >=1.2.0
        - lxml
        - griffe <2
        - holoviews >=1.17.0
        - httpx
        - hvplot
        - instructor >=1.14.3
        - intake <2
        - jinja2 >3.0
        - jsonschema
        - markdown-it-py
        - markitdown
        - narwhals >=2
        - nbformat
        - numpy
        - openai
        - packaging
        - pandas
        - panel >=1.9.0
        - panel-graphic-walker >=0.6.4
        # panel-graphic-walker[kernel] `duckdb` is already present in run sectoinon.
        - gw-dsl-parser
        - pygwalker >=0.4.9.11

        - panel-material-ui >=0.14.0
        - panel-splitjs >=0.4.0
        - param >=2.2.1,<2.5.0
        - pillow >=13.0.0
        - platformdirs
        - pyarrow
        - pydantic >=2.8.0
        - pydantic-extra-types
        - pyyaml
        - requests
        - semchunk
        - sqlglot
        - tabulate
        - tiktoken
        - tornado
        - tqdm
        - vl-convert-python
      run_constrained:
        # ai-monty
        - pydantic-monty >=1.0.0
        # ai-bedrock
        - boto3 >=1.42.23
        # ai-transformers
        - sentence-transformers >=2.7.0
        - transformers >=4.51.0
        # ai-llama
        - llama-cpp-python >=0.3.15
        # ai-google
        - google-genai >=1.56.0
        # ai-litellm
        - litellm !=1.107.0
        # xarray
        - xarray-sql >=0.3.1

    # lumen 1.4.0's SQL tooltip tests need sqlglot >=30.22 (30.21 leaves GROUP BY
    # columns table-qualified in lineage); pkgs/main only has 30.17.0.
    # Drop these deselects once sqlglot >=30.22 is available on the channel.
    {% set deselected_tests = [
        "ai/test_utils.py::test_column_tooltips[group-by]",
        "ai/test_utils.py::test_column_tooltips[group-by-ordinal]",
        "ai/test_utils.py::test_column_tooltips[count-star-and-same-name-cast]",
        "ai/test_utils.py::test_column_tooltips[cte-inlined]",
        "ai/test_utils.py::test_column_tooltips[subquery-column-is-derived]",
        "ai/test_utils.py::test_column_tooltips[quoted-mixed-case]",
        "ai/test_editors.py::test_sql_editor_header_tooltips_name_cte_roots",
    ] %}

    {% set disabled_tests = "test_single_csv_produces_one_table" %}
    {% set disabled_tests = disabled_tests+ " or test_multiple_files_produce_multiple_tables_in_one_source" %}
    {% set disabled_tests = disabled_tests+ " or test_file_format_parsing" %}
    test:
      imports:
        - lumen
        - lumen.auth
        - lumen.ai
        - lumen.command
        - lumen.filters
        - lumen.sources
        - lumen.tests
        - lumen.transforms
        - lumen.ui
        - lumen.validation
        - lumen.variables
        - lumen.views
        - lumen.util
      requires:
        - pip
        - pytest
        - pytest-rerunfailures
        - pytest-asyncio
        - pytest-xdist
        - lxml
        - sqlalchemy
        - setuptools
        - polars
      commands:
        - pip check
        - lumen --help
        # DuckDB 1.4.x does not accept pandas 3 string dtype ('str') in from_df(); skip those ingest tests.
        # also drop optional_imports (they read source files from the sdist tree, not the installed package)
        # - pytest --pyargs lumen.tests -vv -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -k "not optional_imports and not (test_single_csv_produces_one_table or test_multiple_files_produce_multiple_tables_in_one_source or test_file_format_parsing) and not test_param_to_pydantic_conversion"
        - pytest --pyargs lumen.tests -v -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -k "not optional_imports and not ({{ disabled_tests}}) and not test_param_to_pydantic_conversion"{% for t in deselected_tests %} --deselect "{{ t }}"{% endfor %}

    about:
      home: https://github.com/holoviz/lumen
      summary: Illuminate your data. A monitoring solution built on Panel
      description: |
        The Lumen project provides a framework for visual analytics, which allows users to
        build data-driven dashboards from a simple yaml specification. The power of
        Lumen comes from the ability to leverage the powerful data intake, data processing
        and data visualization libraries available in the PyData ecosystem.
      license: BSD-3-Clause
      license_file: LICENSE
      license_family: BSD
      doc_url: https://lumen.holoviz.org/
      dev_url: https://github.com/holoviz/lumen
  # Lumen with AI capabilities - now an alias of lumen
  - name: {{ name }}-ai
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
        - pip
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with AI capabilities
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with huggingface_hub for local AI models
  - name: {{ name }}-ai-local
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - huggingface_hub
        - hf-xet
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with huggingface_hub for local AI models
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with OpenAI support
  - name: {{ name }}-ai-openai
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - openai
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with OpenAI support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with MistralAI support
  - name: {{ name }}-ai-mistralai
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai', exact=True) }}
        - mistralai
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with MistralAI support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with Bedrock support
  - name: {{ name }}-ai-bedrock
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - boto3 >=1.42.23
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with Bedrock support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with Anthropic support
  - name: {{ name }}-ai-anthropic
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - anthropic
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with Anthropic support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen for embedding
  - name: {{ name }}-ai-transformers
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai-local', exact=True) }}
        - sentence-transformers >=2.7.0
        - transformers >=4.51.0
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with embedding support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with llama support
  - name: {{ name }}-ai-llama
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai-local', exact=True) }}
        - llama-cpp-python >=0.3.15
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with llama support
      license: BSD-3-Clause
      license_family: BSD

about:
  home: https://github.com/holoviz/lumen
  summary: Illuminate your data. A monitoring solution built on Panel
  description: |
    Metapackage for lumen and its variants.
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  doc_url: https://lumen.holoviz.org/
  dev_url: https://github.com/holoviz/lumen

extra:
  # skips for easier handling of extras as outputs
  skip-lints:
    - missing_python_build_tool
    - missing_tests
    - missing_pip_check
    - missing_imports_or_run_test_py
    - wrong_output_script_key
  recipe-maintainers:
    - Hoxbro
    - philippjfr
