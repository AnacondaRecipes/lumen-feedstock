{% set name = "lumen" %}
{% set version = "1.2.1" %}

# This recipe builds multiple outputs:
# - lumen: The main package with core functionality
# - lumen-ai: Package with all AI dependencies (except provider-specific ones)
# - lumen-ai-local: Metapackage that adds huggingface_hub for local AI models
# - lumen-ai-openai: Metapackage that adds OpenAI support
# - lumen-ai-mistralai: Metapackage that adds MistralAI support
# - lumen-ai-anthropic: Metapackage that adds Anthropic support

package:
  name: {{ name }}-bundle
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 24d5a4f021ba62602c18885ed6b18478bf8132f2bed7a79b3fa3e27f7f4f7614

build:
  number: 0

outputs:
  # Main lumen package
  - name: {{ name }}
    build:
      entry_points:
        - lumen = lumen.command:main
      skip: true  # [py<311]
      script: python -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
    requirements:
      host:
        - python
        - pip
        - hatchling
        - hatch-vcs
      run:
        - python
        - bokeh
        - chardet
        - duckdb >=1.2.0
        - lxml
        - griffe
        - holoviews >=1.17.0
        - hvplot
        - instructor >=1.14.3
        - intake <2
        - jinja2 >3.0
        - markitdown
        - nbformat
        - numpy
        - packaging
        - pandas
        - panel >=1.7.5
        - panel-graphic-walker >=0.6.4
        - panel-material-ui >=0.8.1
        - panel-splitjs >=0.3.2
        - param >=2.2.1
        - pyarrow
        - pydantic >=2.8.0
        - pydantic-extra-types
        - semchunk
        - sqlglot
        - tabulate
        - tiktoken
        - vl-convert-python
      run_constrained:
        - boto3 >=1.42.23
        - sentence-transformers >=2.7.0
        - transformers >=4.51.0
        - llama-cpp-python >=0.3.15
        - google-genai >=1.56.0
    test:
      imports:
        - lumen
        - lumen.auth
        - lumen.command
        - lumen.tests
        - lumen.util
        - lumen.validation
        - lumen.views
      requires:
        - pip
        - pytest
        - pytest-rerunfailures
        - pytest-asyncio
        - pytest-xdist
        - lxml
        - sqlalchemy
        - setuptools
      commands:
        - pip check
        - lumen --help
        # DuckDB 1.4.x does not accept pandas 3 string dtype ('str') in from_df(); skip those ingest tests.
        # also drop optional_imports (they read source files from the sdist tree, not the installed package)
        - pytest --pyargs lumen.tests -v -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -k "not optional_imports and not (test_single_csv_produces_one_table or test_multiple_files_produce_multiple_tables_in_one_source or test_file_format_parsing)"
    about:
      home: https://github.com/holoviz/lumen
      summary: Illuminate your data. A monitoring solution built on Panel
      description: |
        The Lumen project provides a framework for visual analytics, which allows users to
        build data-driven dashboards from a simple yaml specification. The power of
        Lumen comes from the ability to leverage the powerful data intake, data processing
        and data visualization libraries available in the PyData ecosystem.
      license: BSD-3-Clause
      license_file: LICENSE
      license_family: BSD
      doc_url: https://lumen.holoviz.org/
      dev_url: https://github.com/holoviz/lumen

  # Lumen with AI capabilities - now an alias of lumen
  - name: {{ name }}-ai
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
        - pip
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with AI capabilities
      license: BSD-3-Clause
      license_family: BSD

  # Lumen with huggingface_hub for local AI models
  - name: {{ name|lower }}-ai-local
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - huggingface_hub
        - hf-xet
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with huggingface_hub for local AI models
      license: BSD-3-Clause
      license_family: BSD

  # Lumen with OpenAI support
  - name: {{ name|lower }}-ai-openai
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - openai
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with OpenAI support
      license: BSD-3-Clause
      license_family: BSD

  # Lumen with MistralAI support
  - name: {{ name|lower }}-ai-mistralai
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai', exact=True) }}
        - mistralai
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with MistralAI support
      license: BSD-3-Clause
      license_family: BSD

  # Lumen with Bedrock support
  - name: {{ name|lower }}-ai-bedrock
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - boto3 >=1.42.23
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with Bedrock support
      license: BSD-3-Clause
      license_family: BSD

  # Lumen with Anthropic support
  - name: {{ name|lower }}-ai-anthropic
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - anthropic
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with Anthropic support
      license: BSD-3-Clause
      license_family: BSD

  # Lumen for embedding
  - name: {{ name|lower }}-ai-transformers
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai-local', exact=True) }}
        - sentence-transformers >=2.7.0
        - transformers >=4.51.0
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with embedding support
      license: BSD-3-Clause
      license_family: BSD

  # Lumen with llama support
  - name: {{ name|lower }}-ai-llama
    build:
      skip: true  # [py<311]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai-local', exact=True) }}
        - llama-cpp-python >=0.3.15
    test:
      imports:
        - lumen
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with llama support
      license: BSD-3-Clause
      license_family: BSD

about:
  home: https://github.com/holoviz/lumen
  summary: Illuminate your data. A monitoring solution built on Panel
  description: |
    Metapackage for lumen and its variants.
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  doc_url: https://lumen.holoviz.org/
  dev_url: https://github.com/holoviz/lumen

extra:
  # skips for easier handling of extras as outputs
  skip-lints:
    - missing_python_build_tool
    - missing_tests
    - missing_pip_check
    - missing_imports_or_run_test_py
    - wrong_output_script_key
  recipe-maintainers:
    - Hoxbro
    - philippjfr
