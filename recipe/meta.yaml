{% set name = "lumen" %}
{% set version = "1.2.1" %}

# This recipe builds multiple outputs:
# - lumen: The main package with core functionality
# - lumen-ai: Package with all AI dependencies (except provider-specific ones)
# - lumen-ai-local: Metapackage that adds huggingface_hub for local AI models
# - lumen-ai-openai: Metapackage that adds OpenAI support
# - lumen-ai-mistralai: Metapackage that adds MistralAI support
# - lumen-ai-anthropic: Metapackage that adds Anthropic support
package:
  name: {{ name }}-bundle
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 24d5a4f021ba62602c18885ed6b18478bf8132f2bed7a79b3fa3e27f7f4f7614

build:
  number: 0

outputs:
  # Main lumen package
  - name: {{ name }}
    build:
      entry_points:
        - lumen = lumen.command:main
      skip: true  # [py<311]
      script: python -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
    requirements:
      host:
        - python
        - pip
        - hatchling
        - hatch-vcs
      run:
        - python
        - bokeh
        - chardet
        - duckdb >=1.2.0
        - gw-dsl-parser
        - lxml
        - griffe
        - holoviews >=1.17.0
        - hvplot
        - instructor >=1.14.3
        - intake <2
        - jinja2 >3.0
        - markitdown
        - nbformat
        - numpy
        - packaging
        - pandas
        - panel >=1.7.5
        - panel-graphic-walker >=0.6.4
        - panel-material-ui >=0.8.1
        - panel-splitjs >=0.3.2
        - param >=2.2.1
        - pyarrow
        - pydantic >=2.8.0
        - pydantic-extra-types
        - semchunk
        - sqlglot
        - tabulate
        - tiktoken
        - vl-convert-python
      run_constrained:
        - llama-cpp-python >=0.3.0
        - pygwalker >=0.4.9.11
    test:
      source_files:
        - lumen/tests
      imports:
        - lumen
        - lumen.auth
        - lumen.command
        - lumen.tests
        - lumen.util
        - lumen.validation
        - lumen.views
      requires:
        - pip
        - pydantic
        - duckdb
        - griffe
        - pydantic-extra-types
        - jsonschema
        - nbformat
      commands:
        - pip check
        - lumen --help
        # - pytest lumen/tests -v
        # Upstream tests (pytest lumen/tests -v) are disabled due to dependency version
        # conflicts with pandas 2.3+/pyarrow StringDtype changes, dask 2024+ legacy API
        # removal, and bokeh version incompatibilities between panel and dask requirements
    about:
      home: https://github.com/holoviz/lumen
      summary: Illuminate your data. A monitoring solution built on Panel
      description: |
        The Lumen project provides a framework for visual analytics, which allows users to
        build data-driven dashboards from a simple yaml specification. The power of
        Lumen comes from the ability to leverage the powerful data intake, data processing
        and data visualization libraries available in the PyData ecosystem.
      license: BSD-3-Clause
      license_file: LICENSE
      license_family: BSD
      doc_url: https://lumen.holoviz.org/
      dev_url: https://github.com/holoviz/lumen
  # Lumen with AI capabilities
  - name: {{ name }}-ai
    build:
      skip: true  # [py<311 or win]
    requirements:
      host:
        - python
        - pip
      run:
        - python
        - {{ pin_subpackage('lumen', exact=True) }}
        - griffe
        - nbformat
        - duckdb >=1.2.0
        - pyarrow
        - instructor >=1.14.3
        - pydantic >=2.8.0
        - pydantic-extra-types
        - panel-graphic-walker >=0.6.4
        - pygwalker >=0.4.9.11
        - markitdown
        - tiktoken
        - chardet
        - semchunk
    test:
      commands:
        - pip check
        - pip check
        - pip check
        - pip check
      requires:
        - pip
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with AI capabilities
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with huggingface_hub for local AI models
  - name: {{ name|lower }}-ai-local
    build:
      skip: true  # [py<311 or win]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai', exact=True) }}
        - huggingface_hub
        - hf-xet
    test:
      commands:
        - pip check
        - pip check
        - pip check
        - pip check
      requires:
        - pip
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with huggingface_hub for local AI models
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with OpenAI support
  - name: {{ name|lower }}-ai-openai
    build:
      skip: true  # [py<311 or win]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai', exact=True) }}
        - openai
    test:
      commands:
        - pip check
        - pip check
        - pip check
        - pip check
      requires:
        - pip
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with OpenAI support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with MistralAI support
  - name: {{ name|lower }}-ai-mistralai
    build:
      skip: true  # [py<311 or win]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai', exact=True) }}
        - mistralai
    test:
      commands:
        - pip check
        - pip check
        - pip check
        - pip check
      requires:
        - pip
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with MistralAI support
      license: BSD-3-Clause
      license_family: BSD
  # Lumen with Anthropic support
  - name: {{ name|lower }}-ai-anthropic
    build:
      skip: true  # [py<311 or win]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('lumen-ai', exact=True) }}
        - anthropic
    test:
      commands:
        - pip check
        - pip check
        - pip check
        - pip check
      requires:
        - pip
    about:
      home: https://github.com/holoviz/lumen
      summary: Lumen with Anthropic support
      license: BSD-3-Clause
      license_family: BSD

about:
  home: https://github.com/holoviz/lumen
  summary: Illuminate your data. A monitoring solution built on Panel
  description: |
    Metapackage for lumen and its variants.
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  doc_url: https://lumen.holoviz.org/
  dev_url: https://github.com/holoviz/lumen

extra:
  recipe-maintainers:
    - Hoxbro
    - philippjfr
